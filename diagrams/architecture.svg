<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="100%" height="100%">
  <rect width="900" height="420" fill="#090d16" rx="14" />
  <text x="450" y="42" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">
    AegisSRE — Autonomous On-Call Incident Agent Architecture
  </text>

  <!-- Phase 1 Box -->
  <rect x="40" y="90" width="240" height="260" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
  <text x="160" y="125" fill="#60a5fa" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">PHASE 1: PLANNING</text>
  <text x="160" y="165" fill="#e2e8f0" font-family="sans-serif" font-size="13" text-anchor="middle">PagerDuty Alert Ingestion</text>
  <text x="160" y="205" fill="#e2e8f0" font-family="sans-serif" font-size="13" text-anchor="middle">Gemini 2.5 Flash Reasoning</text>
  <text x="160" y="245" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">Generates 5-Step Triage Plan</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="280" y1="220" x2="330" y2="220" stroke="#6366f1" stroke-width="3" />
  <polygon points="330,214 342,220 330,226" fill="#6366f1" />

  <!-- Phase 2 Box -->
  <rect x="342" y="90" width="240" height="260" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
  <text x="462" y="125" fill="#fbbf24" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">PHASE 2: TOOL-USE</text>
  <text x="462" y="165" fill="#e2e8f0" font-family="sans-serif" font-size="13" text-anchor="middle">1. Telemetry & Log Analyzer</text>
  <text x="462" y="205" fill="#c084fc" font-family="sans-serif" font-size="13" text-anchor="middle">2. Live GitHub REST API</text>
  <text x="462" y="245" fill="#e2e8f0" font-family="sans-serif" font-size="13" text-anchor="middle">3. SRE Runbook RAG Lookup</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="582" y1="220" x2="632" y2="220" stroke="#10b981" stroke-width="3" />
  <polygon points="632,214 644,220 632,226" fill="#10b981" />

  <!-- Phase 3 Box -->
  <rect x="644" y="90" width="216" height="260" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2" />
  <text x="752" y="125" fill="#34d399" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">PHASE 3: ACTION</text>
  <text x="752" y="165" fill="#e2e8f0" font-family="sans-serif" font-size="13" text-anchor="middle">4. Auto-Remediation Execution</text>
  <text x="752" y="205" fill="#e2e8f0" font-family="sans-serif" font-size="13" text-anchor="middle">(Rollback / Restart / Scale)</text>
  <text x="752" y="245" fill="#34d399" font-family="sans-serif" font-size="13" text-anchor="middle">5. Discord Webhook RCA</text>
</svg>